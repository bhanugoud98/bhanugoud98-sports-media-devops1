version: "3"
services:
  product-service:
    build: ./product-service
    ports:
      - "5000:5000"
    container_name: product-service

  user-service:
    build: ./user-service
    ports:
      - "5001:5001"
    container_name: user-service

  order-service:
    build: ./order-service
    ports:
      - "5002:5002"
    container_name: order-service
